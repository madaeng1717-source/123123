<style>
:root{--bg:#0d1a0e;--panel:#17261a;--line:#2f5030;--txt:#eef6e2;--dim:#9db894;--gold:#ffd24a;--hp:#e25b4b;--xp:#5cc8ff;--ok:#8be05a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:12px;background:radial-gradient(ellipse at top,#21421e,var(--bg) 70%);color:var(--txt);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
.wrap{width:100%;max-width:960px;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.hud{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:14px;align-items:center}
.lv{font-size:26px;font-weight:800;color:var(--ok);line-height:1}
.lv small{display:block;font-size:11px;color:var(--dim);font-weight:500;margin-top:3px}
.bar{position:relative;height:16px;border-radius:8px;background:#0b140c;border:1px solid #284629;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:8px;transition:width .15s}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
#hpb i{background:linear-gradient(#f07a68,var(--hp))}#xpb i{background:linear-gradient(#8fdcff,#2f9ad6)}
.gold{font-size:20px;font-weight:800;color:var(--gold);text-align:right;white-space:nowrap}
.gold small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.stage{position:relative;border-radius:16px;overflow:hidden;border:2px solid #2f5a2c;box-shadow:0 10px 40px #0008}
canvas{display:block;width:100%;height:auto;background:#4a9632}
.tools{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.tools button{background:#0b140ccc;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.tools button:hover{border-color:var(--ok)}
.stat{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.sinfo{font-size:13px;line-height:1.6;min-width:190px;color:var(--dim)}.sinfo b{color:var(--gold);font-size:16px}.sbtns{display:flex;gap:8px;flex:1;min-width:260px}.sb{flex:1}.sb em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:2px}.sb.on{border-color:var(--ok);box-shadow:0 0 12px #8be05a55}
.ups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.up{background:#10200f;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:10px;text-align:left;cursor:pointer;font:inherit;transition:transform .08s,border-color .15s}
.up:hover:not(:disabled){border-color:var(--ok);transform:translateY(-2px)}
.up:active:not(:disabled){transform:translateY(0)}
.up:disabled{opacity:.5;cursor:not-allowed}
.up b{display:block;font-size:14px}.up em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin:2px 0 6px}
.up .c{font-size:13px;color:var(--gold);font-weight:700}
#log{font-size:12px;color:var(--dim);height:64px;overflow:hidden;line-height:1.55}
#log div:first-child{color:var(--txt)}
@media(max-width:700px){.hud{grid-template-columns:1fr 1fr}.ups{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.gacha{display:flex;gap:8px;flex-wrap:wrap}
.gacha button{flex:1;min-width:140px;padding:12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(#24402a,#17301c);color:var(--txt);font:700 14px inherit;cursor:pointer}
.gacha button:hover:not(:disabled){border-color:#8fe3ff}.gacha button:disabled{opacity:.45;cursor:not-allowed}
.gacha small{width:100%;color:var(--dim);font-size:12px}
#md{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
#md[hidden]{display:none}
.mb{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:780px;width:100%;max-height:90vh;overflow:auto;padding:14px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:16px;font-weight:700}
.mh button{background:#0b140c;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.cd{position:relative;border:2px solid var(--c);border-radius:12px;background:radial-gradient(circle at 50% 75%,color-mix(in srgb,var(--c) 32%,#0000),#10200f 75%);padding:6px;text-align:center;cursor:pointer;box-shadow:0 0 12px color-mix(in srgb,var(--c) 40%,#0000);animation:pop .4s backwards}
.cd canvas{width:100%;height:auto;display:block}.cd b{display:block;font-size:12px;color:var(--c)}
.cd small{display:block;font-size:11px;color:var(--dim);min-height:28px;margin-top:2px}
.cd.eq{outline:2px solid #fff}.cd.hh{animation:pop .4s backwards,gl 1.4s ease-in-out infinite alternate}
.cd.nw::after{content:'NEW';position:absolute;top:4px;right:6px;font-size:10px;font-weight:800;color:#ff5;text-shadow:0 1px 2px #000}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}}
@keyframes gl{to{box-shadow:0 0 26px var(--c),0 0 6px #fff8}}
.cd.ll{border-color:#ff4d6d!important;box-shadow:0 0 18px #ff4d6d88,0 0 38px #ffb02e55!important}
</style>

(function(){const away=Math.min((Date.now()-S.last)/1000,8*3600);
 if(away>60&&S.rate>0){const g=Math.floor(S.rate*away*.5);S.gold+=g;gain(Math.floor(g*.6),0);log(`😴 자리를 비운 ${Math.floor(away/60)}분 동안 ${fmt(g)}G를 벌었어요.`)}
 else log('🌾 초원에 오신 것을 환영합니다. 화면을 한 번 클릭하면 효과음이 켜져요.')})();

let last=performance.now(),uiT=0;
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;
 if(freeze>0)freeze-=dt;else for(let i=0;i<speed;i++)update(dt);draw();if(MO)pv();
 uiT-=dt;if(uiT<=0){ui();uiT=.15}requestAnimationFrame(loop)}
for(let i=0;i<3;i++)spawn();
